name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Show project structure
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec 2>/dev/null || echo "NOT FOUND"
          echo "=== Files in root ==="
          ls -la | head -20
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37
          buildozer --version

      - name: Build APK
        env:
          ANDROIDSDK_ROOT: ${{ github.workspace }}/.android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROIDSDK_ROOT"
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))"
          buildozer -v android debug 2>&1 | tee build.log || exit_code=$?
          if [ -z "$exit_code" ]; then exit_code=0; fi
          echo "Build exit code: $exit_code"
          tail -100 build.log
      
      - name: Save build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            .buildozer/
      
      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peoplerecognition-apk
          path: bin/*.apk