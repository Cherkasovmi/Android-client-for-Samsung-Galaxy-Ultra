name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to clean state
        run: |
          git reset --hard origin/main
          git clean -fd

      - name: Show project structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec

      - name: Install dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake build-essential

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          buildozer --version

      - name: Pre-seed flaky p4a dependencies
        run: |
          mkdir -p "$HOME/.buildozer/android/packages/freetype"
          cd "$HOME/.buildozer/android/packages/freetype"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "freetype-2.14.1.tar.gz" \
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
          touch ".mark-freetype-2.14.1.tar.gz"
          ls -la

      - name: Build APK
        env:
          URL_freetype: "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
        run: |
          set -o pipefail
          set +e
          buildozer -v android debug 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "=== Build log tail ==="
          tail -150 build.log
          echo "=== Searching error context ==="
          grep -n -i -E -B2 -A4 "error|exception|failed|command not found|fatal|Traceback" build.log | tail -120
          echo "=== APK files ==="
          ls -la bin/*.apk 2>/dev/null || echo "No APK found"
          exit $rc

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            bin/*.apk
            build.log
            .buildozer/