name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to clean state
        run: |
          git reset --hard origin/main
          git clean -fd

      - name: Show project structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec

      - name: Install dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake build-essential

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          buildozer --version

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          echo "=== Build log tail ==="
          tail -200 build.log
          echo "=== APK files ==="
          ls -la bin/*.apk 2>/dev/null || echo "No APK found"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            bin/*.apk
            build.log
            .buildozer/